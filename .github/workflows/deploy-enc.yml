name: Deploy Encrypted to Main

on:
  push:
    branches: ["dev-clean"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev-clean
        uses: actions/checkout@v4
        with:
          ref: dev-clean

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Obfuscator
        run: npm install -g javascript-obfuscator

      - name: Obfuscate JavaScript with Domain Lock & Anti-Theft Redirect
        run: |
          # 1. Main App Options (Full Domain Lock + Instant Redirect to seismik.gracely.my.id)
          MAIN_OPTIONS="--compact true --self-defending true --disable-console-output false --debug-protection true --debug-protection-interval 4000 --domain-lock seismik.gracely.my.id,gracely011.github.io,localhost,127.0.0.1 --domain-lock-redirect-url https://seismik.gracely.my.id/ --string-array-encoding base64,rc4"
          
          # 2. Service Worker Options (Worker-Safe Obfuscation)
          SW_OPTIONS="--compact true --self-defending false --disable-console-output false --string-array-encoding base64,rc4"
          
          if [ -f "./app.js" ]; then
            javascript-obfuscator ./app.js --output ./app.js $MAIN_OPTIONS
          fi

          if [ -f "./faults.js" ]; then
            javascript-obfuscator ./faults.js --output ./faults.js $MAIN_OPTIONS
          fi
          
          if [ -f "./sw.js" ]; then
            javascript-obfuscator ./sw.js --output ./sw.js $SW_OPTIONS
          fi

      - name: Setup Git Config
        run: |
          git config --global user.name "gracely011"
          git config --global user.email "gracely011@users.noreply.github.com"

      - name: Force Push to Main
        run: |
          git --work-tree=. add .
          git commit -m "Deploy: Encrypted build with Domain Lock from dev-clean"
          git push origin HEAD:main --force
