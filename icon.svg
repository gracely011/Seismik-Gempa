<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#263238"/>
      <stop offset="70%" stop-color="#1a1c1e"/>
      <stop offset="100%" stop-color="#111215"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00b0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00b0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="45%" stop-color="#ffb300"/>
      <stop offset="60%" stop-color="#ff1744"/>
      <stop offset="85%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
  </defs>

  <!-- Background App Rounded Surface -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="6"/>

  <!-- Radar Concentric Rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#37474f" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#455a64" stroke-width="4" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#00e5ff" stroke-width="5" stroke-opacity="0.6" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="145" fill="url(#coreGlow)"/>

  <!-- Crosshair Guides -->
  <line x1="256" y1="46" x2="256" y2="466" stroke="#546e7a" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 6"/>
  <line x1="46" y1="256" x2="466" y2="256" stroke="#546e7a" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 6"/>

  <!-- Dynamic Seismic Waveform (Heartbeat of Earth) -->
  <path d="M 66 256 L 140 256 L 165 240 L 185 270 L 210 215 L 235 310 L 256 120 L 277 392 L 302 185 L 325 295 L 345 235 L 372 256 L 446 256" 
        fill="none" 
        stroke="url(#waveGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Glowing Epicenter Marker Point -->
  <circle cx="256" cy="120" r="18" fill="#ff1744" stroke="#ffffff" stroke-width="4"/>
  <circle cx="256" cy="120" r="28" fill="none" stroke="#ff1744" stroke-width="3" stroke-opacity="0.7"/>
</svg>
